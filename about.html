<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BYFORCEUK - About</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="css/about.css" rel="stylesheet">
</head>
<body>
    <!-- Help Button -->
    <div class="help-btn">?</div>

    <!-- Header -->
    <header class="text-center py-3">
        <h1 class="logo">BYFORCEUK</h1>
        <!-- Navigation -->
        <nav class="nav-container d-flex justify-content-center gap-2 mt-3">
            <a href="index.html" class="nav-btn">HOME</a>
            <a href="shop.html" class="nav-btn">SHOP</a>
            <a href="games.html" class="nav-btn">GAMES</a>
            <a href="about.html" class="nav-btn active">ABOUT</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container my-4">
        <div class="content-card">
            <!-- Audio Player Section -->
            <div class="audio-section">
                <button class="audio-btn" id="playAudioBtn">
                    <span class="audio-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="speaker-icon">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </span>
                    <span class="audio-text">Play Audio</span>
                </button>
            </div>

            <!-- Hidden Audio Element -->
            <audio id="backgroundAudio" loop>
                <source src="assets/audio/background.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-bar">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-4">
                    <span class="footer-brand">BYFORCE</span>
                </div>
                <div class="col-4 text-center">
                    <a href="mailto:info@byforce.uk" class="footer-link">info@byforce.uk</a>
                </div>
                <div class="col-4 text-end">
                    <span class="footer-phone">+44 7500 324 868</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/about.js"></script>
</body>
</html>
